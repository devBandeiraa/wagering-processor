name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # Integration, concurrency and recovery suites need Postgres and SQS
      # (bun run infra:up), so CI runs the unit suite only.
      - name: Unit tests
        run: bun run test:unit
